<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">通信与协作主题封面</title>
  <desc id="desc">深海蓝背景上的四组光点与交织的弧线，表现多进程协作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#071d33"/><stop offset=".6" stop-color="#124d68"/><stop offset="1" stop-color="#317e87"/>
    </linearGradient>
    <radialGradient id="light"><stop stop-color="#9fe8d8" stop-opacity=".35"/><stop offset="1" stop-color="#9fe8d8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="610" cy="320" r="350" fill="url(#light)"/>
  <g fill="none" stroke="#8fd9d7" stroke-width="3" opacity=".65">
    <path d="M220 220 C420 30 780 30 980 220 M220 220 C360 450 840 450 980 220"/>
    <path d="M220 410 C420 600 780 600 980 410 M220 410 C360 180 840 180 980 410"/>
    <path d="M220 220 Q50 315 220 410 M980 220 Q1150 315 980 410"/>
  </g>
  <g fill="#e0fff4" stroke="#6ab8c2" stroke-width="8">
    <circle cx="220" cy="220" r="19"/><circle cx="980" cy="220" r="19"/>
    <circle cx="220" cy="410" r="19"/><circle cx="980" cy="410" r="19"/>
  </g>
  <g fill="#f6c98c"><circle cx="430" cy="275" r="6"/><circle cx="760" cy="260" r="6"/><circle cx="620" cy="485" r="6"/></g>
</svg>
